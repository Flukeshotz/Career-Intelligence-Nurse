<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--sc-bg-journey);font-family:var(--sc-font-ui);display:flex;gap:20px;align-items:center}.coin{height:38px;border-radius:200px;background:rgba(237,184,67,.2);padding:4px 8px;display:flex;align-items:center;gap:8px;box-sizing:border-box}.coin img{width:30px;height:30px;box-shadow:var(--sc-shadow-coin)}.coin span{font-family:var(--sc-font-display);font-size:13px;color:var(--sc-navy-700)}.flag{background:#fff;border-radius:7.6px;padding:3.17px 6.34px;font-family:var(--sc-font-display);font-weight:500;font-size:7.6px}.streak{width:220px;height:80px;border-radius:18px;background:linear-gradient(114.8deg,#FAF0B3,#D7AA48);padding:10px;box-sizing:border-box;display:flex;gap:12px;align-items:center}.streak .box{width:72px;height:60px;border-radius:10px;background:rgba(0,0,0,.05)}.streak .t{font-family:var(--sc-font-display);font-weight:500;font-size:13px;color:var(--sc-navy-900)}.node{width:51px;height:51px;border-radius:50%;background:#fff;box-shadow:var(--sc-shadow-card);display:grid;place-items:center;font-size:26px}</style></head><body>
<div class="coin"><img src="../assets/img/coin.png" alt="coin"><span>230</span></div>
<div class="flag">30%</div>
<div class="node">🇩🇪</div>
<div class="streak"><div class="box"></div><div class="t">4-day streak<br>Keep it going</div></div>
</body></html>
