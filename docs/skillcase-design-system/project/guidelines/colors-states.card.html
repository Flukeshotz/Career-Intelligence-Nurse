<!-- @dsCard group="Colors" viewport="700x150" name="Answer states" subtitle="Correct, incorrect, locked — the three states every exercise resolves to" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--sc-font-ui);background:var(--sc-bg-journey)}.row{display:flex;gap:12px}.opt{flex:1;height:52px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--sc-line-200);display:flex;align-items:center;gap:8px;padding:10px;box-sizing:border-box;font-size:16px;font-weight:500;color:var(--sc-ink-900)}.key{width:32px;align-self:stretch;border-radius:4px;background:rgba(0,0,0,.05);display:grid;place-items:center;font-size:16px;color:rgba(24,29,39,.3)}.correct{box-shadow:inset 0 0 0 2px var(--sc-green-600);background:rgba(1,144,53,.08)}.wrong{box-shadow:inset 0 0 0 2px var(--sc-red-500);background:rgba(236,70,58,.08)}.locked{opacity:.5}</style></head><body>
<div class="row">
<div class="opt"><span class="key">A</span>der Kuchen</div>
<div class="opt correct"><span class="key">B</span>die Butter</div>
<div class="opt wrong"><span class="key">C</span>das Brot</div>
<div class="opt locked"><span class="key">D</span>Locked</div>
</div></body></html>
