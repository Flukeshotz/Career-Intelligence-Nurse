<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-family);background:#fff}.row{display:flex;gap:10px}.sw{flex:1}.chip{height:64px;border-radius:8px;box-shadow:var(--shadow-xs)}.n{font-size:11px;font-weight:600;color:var(--color-text-primary);margin-top:8px}.h{font-size:11px;color:var(--color-text-muted)}</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--color-primary)"></div><div class="n">--color-primary</div><div class="h">#002856</div></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-light)"></div><div class="n">--color-primary-light</div><div class="h">#003d83</div></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-muted)"></div><div class="n">--color-primary-muted</div><div class="h">#89a1bd</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent)"></div><div class="n">--color-accent</div><div class="h">#edb843</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-light)"></div><div class="n">--color-accent-light</div><div class="h">#ffebbe</div></div>
<div class="sw"><div class="chip" style="background:var(--color-accent-dark)"></div><div class="n">--color-accent-dark</div><div class="h">#c48b0e</div></div>
<div class="sw"><div class="chip" style="background:var(--app-navy-header)"></div><div class="n">--app-navy-header</div><div class="h">#083262</div></div>
</div></body></html>
