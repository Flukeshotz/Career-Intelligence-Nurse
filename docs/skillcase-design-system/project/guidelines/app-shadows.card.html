<!-- @dsCard group="Foundations" viewport="700x170" name="App shadows" subtitle="Four steps. --shadow-md is the card shadow every feature tile uses" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px;font-family:var(--font-family);background:var(--color-bg-secondary);display:flex;gap:22px}.i{text-align:center}.b{width:112px;height:66px;background:#fff;border-radius:8px}.n{font-size:10px;color:var(--color-text-tertiary);margin-top:9px}</style></head><body>
<div class="i"><div class="b" style="box-shadow:var(--shadow-xs)"></div><div class="n">--shadow-xs</div></div>
<div class="i"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="n">--shadow-sm</div></div>
<div class="i"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="n">--shadow-md · cards</div></div>
<div class="i"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="n">--shadow-lg · modals</div></div>
<div class="i"><div class="b" style="box-shadow:var(--app-tabbar-shadow)"></div><div class="n">--app-tabbar-shadow</div></div>
</body></html>
