<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--sc-font-ui);background:#fff}.row{display:flex;gap:12px}.sw{flex:1}.chip{height:76px;border-radius:var(--sc-radius-lg);box-shadow:var(--sc-inset-hairline)}.n{font-size:11px;font-weight:600;margin-top:8px;color:var(--sc-ink-900)}.h{font-size:11px;color:var(--sc-ink-400)}</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--sc-bg-journey)"></div><div class="n">--sc-bg-journey</div><div class="h">#CFE3FF → #E4EFFF, 180°</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-bg-reward)"></div><div class="n">--sc-bg-reward</div><div class="h">#F7D78E → #FFFFFF</div></div>
<div class="sw"><div class="chip" style="background:linear-gradient(114.8deg,#FAF0B3,#D7AA48)"></div><div class="n">streak card</div><div class="h">#FAF0B3 → #D7AA48, 114.8°</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-scrim-dark)"></div><div class="n">--sc-scrim-dark</div><div class="h">rgba(0,0,0,.6)</div></div>
</div></body></html>
