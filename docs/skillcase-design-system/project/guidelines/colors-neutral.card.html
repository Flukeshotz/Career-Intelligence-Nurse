<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Text ink ramp and the hairline greys that build every card" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--sc-font-ui);background:#fff}.row{display:flex;gap:10px}.sw{flex:1}.chip{height:64px;border-radius:var(--sc-radius-md);box-shadow:var(--sc-inset-hairline)}.n{font-size:11px;font-weight:600;color:var(--sc-ink-900);margin-top:8px}.h{font-size:11px;color:var(--sc-ink-400)}</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--sc-black)"></div><div class="n">black</div><div class="h">#000000</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-ink-900)"></div><div class="n">ink-900</div><div class="h">#181D27</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-ink-700)"></div><div class="n">ink-700</div><div class="h">#414651</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-ink-600)"></div><div class="n">ink-600</div><div class="h">#535862</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-ink-400)"></div><div class="n">ink-400</div><div class="h">#7B7B7B</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-line-200)"></div><div class="n">line-200</div><div class="h">#DBDBDB</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-line-100)"></div><div class="n">line-100</div><div class="h">#EFEFEF</div></div>
<div class="sw"><div class="chip" style="background:var(--sc-white)"></div><div class="n">white</div><div class="h">#FFFFFF</div></div>
</div></body></html>
