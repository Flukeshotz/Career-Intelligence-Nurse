<!-- @dsCard group="App" viewport="1700x1700" name="Exam system — the eight screens" subtitle="Four B1 workspaces and four results screens: the surface that was audited in phase 3 but never built" -->
<!doctype html><html><head><meta charset="utf-8"><title>Skillcase — exam system</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>document.write('<script src="../../_ds_bundle.js?v='+Date.now()+'"><\/script>')</script>
<style>
html,body{margin:0;background:#f4f5f7;font-family:var(--font-family)}
#root{width:1700px;padding:36px 32px 56px;box-sizing:border-box}
h1{margin:0 0 6px;font-size:26px;color:#002856;letter-spacing:-.01em}
.lede{margin:0 0 30px;font-size:14px;color:#5b6472;max-width:96ch;line-height:1.6}
h2{margin:34px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#002856}
.sub{margin:0 0 18px;font-size:12.5px;color:#5b6472;line-height:1.55}
.grid{display:flex;gap:26px;flex-wrap:wrap}
.item{display:flex;flex-direction:column;gap:9px}
.frame{width:390px;height:780px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(8,50,98,.13);border:1px solid #e4e4e7;flex:none}
.cap{font-size:11.5px;color:#414651;line-height:1.45;width:390px}
.cap b{display:block;color:#002856;font-size:12.5px;margin-bottom:2px}
.cap code{background:#eef1f5;border-radius:3px;padding:0 4px;font-size:11px}
.note{border-left:3px solid #eec139;background:#fffdf5;padding:13px 17px;margin:0 0 26px;font-size:13px;color:#002856;line-height:1.6;max-width:104ch}

/* SD-003 — focus ring at the kit layer. The token is validated for both themes. */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{box-shadow:var(--ui-focus-ring);outline:none;border-radius:inherit}
</style>
</head><body><div id="root"></div>
<script type="text/babel" src="ExamScreens.jsx"></script>
<script type="text/babel">
const F = ({ title, note, children }) => (
  <div className="item">
    <div className="frame">{children}</div>
    <div className="cap"><b>{title}</b>{note}</div>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(
  <React.Fragment>
    <h1>Exam system — the eight screens</h1>
    <p className="lede">Phase 3 audited this surface and deliberately built no screens. The hold was never lifted, which left the most behaviourally complex system in the product with parts but no shape. These are the four B1 workspaces and four results screens, and all eight are instances of one structure: back bar → optional meter row → scrolling well → footer action.</p>
    <div className="note"><strong>Three colour facts this surface establishes.</strong> Exam headings are <code>text-sky-950</code> <code>#082f49</code>, not brand navy — which is why <code>--ui-text-primary</code> is the assessment ink. The primary CTA is <code>bg-blue-950</code> <code>#172554</code>. But <em>Review Answers</em> is <code>#002856</code> navy, not blue-950 — a real distinction inside one screen, reproduced rather than tidied.</div>

    <h2>Workspaces</h2>
    <p className="sub">Timed, one block at a time, with the amber segment track above and a floating footer over a white fade. The writing screen shows the busy state — note the footer's live region announces "Submitting your answers" to assistive tech, which production does not do.</p>
    <div className="grid">
      <F title="Reading workspace" note={<>Passage card at <code>leading-8</code>, difficulty badge, Listen button, lettered options. <code>ExamReadingWorkspace.jsx</code></>}><ExamReadingWorkspace /></F>
      <F title="Listening workspace" note={<>Same skeleton; the passage slot holds <code>AudioPlayer</code> instead. <code>ExamListeningWorkspace.jsx</code></>}><ExamListeningWorkspace /></F>
      <F title="Writing workspace — busy" note={<>Prompt card plus the borderless <code>TextField multiline</code>. Footer disabled and announcing. <code>ExamWritingWorkspace.jsx</code></>}><ExamWritingWorkspace /></F>
      <F title="Speaking workspace" note={<><code>AudioTapButton</code> at 80px, then playback of the take. <code>ExamSpeakingWorkspace.jsx</code></>}><ExamSpeakingWorkspace /></F>
    </div>

    <h2>Results</h2>
    <p className="sub">Reading and Listening share the summary well: greeting, ring, three stat tiles, two actions. Writing and Speaking diverge because they are marked qualitatively — bands rather than a count — which is the two-scoring-model finding from phase 2 (D-009) made visible.</p>
    <div className="grid">
      <F title="Reading results" note={<>Ring on the <code>black/5</code> well; correct / incorrect / skipped tiles. <code>ExamReadingResults.jsx</code></>}><ExamReadingResults /></F>
      <F title="Listening results" note={<>Identical structure, different data — evidence they are one template, not two. <code>ExamListeningResults.jsx</code></>}><ExamListeningResults /></F>
      <F title="Writing results" note={<>Band bars plus the marked-up answer: <code>#d0021b</code> on <code>#fff0f1</code> with a dashed rule. <code>ExamWritingResults.jsx</code></>}><ExamWritingResults /></F>
      <F title="Speaking results" note={<>Ring, three bands, and the recording in review styling. <code>ExamSpeakingResults.jsx</code></>}><ExamSpeakingResults /></F>
    </div>

    <h2>What these screens do not cover</h2>
    <p className="sub">System B (<code>/exam/:testId</code>, teacher-marked, has the <code>isUrgent</code> treatment B1 lacks) and System C (scholarship) are separate product systems per D-010 and are not drawn here. The block selector and paper select belong to the <em>select</em> template, not this one.</p>
  </React.Fragment>
);
</script>
</body></html>
