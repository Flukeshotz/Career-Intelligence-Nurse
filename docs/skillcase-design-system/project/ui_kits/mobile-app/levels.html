<!doctype html><html><head><meta charset="utf-8"><title>Skillcase — level surfaces</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>document.write('<script src="../../_ds_bundle.js?v='+Date.now()+'"><\/script>')</script>
<style>html,body{margin:0;background:#f4f5f7;font-family:var(--font-family)}#root{width:1700px;padding:28px 0 36px}*{-webkit-font-smoothing:antialiased}
/* SD-003 — focus ring at the kit layer. The token is validated for both themes. */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{box-shadow:var(--ui-focus-ring);outline:none;border-radius:inherit}
</style>
</head><body><div id="root"></div>
<script type="text/babel" src="appModel.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel">
const NOTES = {
  A1: 'Guided German · German Practice · German Classes. Tiles route to /a1/*. Jobs → the /jobs gate.',
  A2: 'Same three tabs. Tiles route to /a2/* with A2 copy. Jobs → the /jobs gate.',
  B1: 'Two tabs only: Job Preparation ⇄ German Jobs. Tiles route to /b1/*. Jobs → the real pipeline.',
  B2: 'Identical to B1 — isB1PracticeLevel() collapses both, so the navbar even prints “B1 German Level”. Only the level ladder shows B2.',
};
function Frame({ level }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: 390 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 700, color: '#002856' }}>{level}</div>
        <div style={{ fontSize: 12, lineHeight: '17px', color: '#5b6472', minHeight: 51, textWrap: 'pretty' }}>{NOTES[level]}</div>
      </div>
      <div style={{ borderRadius: 20, overflow: 'hidden', boxShadow: '0 18px 44px rgba(8,50,98,.16)', background: '#fff' }}>
        <AppScreen level={level} height={800} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'flex', gap: 32, justifyContent: 'center' }}>
    {['A1','A2','B1','B2'].map(l => <Frame key={l} level={l} />)}
  </div>
);
</script></body></html>
