<!doctype html><html><head><meta charset="utf-8"><title>Skillcase — job pipeline</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>document.write('<script src="../../_ds_bundle.js?v='+Date.now()+'"><\/script>')</script>
<style>html,body{margin:0;background:#f4f5f7;font-family:var(--font-family)}#root{width:2140px;padding:30px 0 40px;display:flex;flex-wrap:wrap;gap:32px;justify-content:center;box-sizing:border-box}*{-webkit-font-smoothing:antialiased}
/* SD-003 — focus ring at the kit layer. The token is validated for both themes. */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{box-shadow:var(--ui-focus-ring);outline:none;border-radius:inherit}
</style>
</head><body><div id="root"></div>
<script type="text/babel" src="JobFlowScreens.jsx"></script>
<script type="text/babel">
function Frame({ name, note, Screen }) {
  return (
    <div style={{ width: 390, display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div>
        <div style={{ fontSize: 14, fontWeight: 700, color: '#002856' }}>{name}</div>
        <div style={{ fontSize: 12, lineHeight: '17px', color: '#5b6472', minHeight: 34, textWrap: 'pretty' }}>{note}</div>
      </div>
      <div style={{ borderRadius: 20, overflow: 'hidden', boxShadow: '0 18px 44px rgba(8,50,98,.16)', background: '#fff' }}><Screen /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <React.Fragment>{window.JOB_SCREENS.map(([name, note, Screen]) => <Frame key={name} name={name} note={note} Screen={Screen} />)}</React.Fragment>
);
</script></body></html>
