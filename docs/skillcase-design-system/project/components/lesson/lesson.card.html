<style>html,body{margin:0;background:#F4F8FF;font-family:var(--font-family)}#root{width:900px;padding:24px;box-sizing:border-box;display:grid;grid-template-columns:290px 290px 250px;gap:24px;align-items:start}.lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a93a0;margin:0 0 8px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { LessonProgressBar, MayaPrompt, OptionRow, LessonFooter, AudioTapButton, WordChip, ChatBubble } = window.SkillcaseDesignSystem_a27963;
const A = '../../assets/img/';
const Group = ({ label, children, style }) => (
  <div style={style}><p className="lbl">{label}</p>{children}</div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment>
  <Group label="Header · Maya"><div style={{background:'#F4F8FF',borderRadius:12,overflow:'hidden',border:'1px solid #e2e8f0'}}>

  </div></Group>
  <Group label="Answer rows"><div style={{display:'flex',flexDirection:'column',gap:10}}>
    <OptionRow letter="A" label="Das Brot" />

  <Group label="Audio · chips"><div style={{display:'flex',flexDirection:'column',gap:22}}>

  <Group label="Footer"><div style={{display:'flex',flexDirection:'column',gap:12}}>

    <LessonFooter primaryLabel="Next" showPrev />

  <Group label="Conversation" style={{gridColumn:'span 2'}}><div style={{background:'#D4E5FF',borderRadius:12,padding:'16px 14px 0'}}>
    <ChatBubble text="Guten Tag! Was möchten Sie?" meaning="Good day! What would you like?" />
    <ChatBubble side="learner" text="Ein Brot, bitte." />
  </div></Group>
