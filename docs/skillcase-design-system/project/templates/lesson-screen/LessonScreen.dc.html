<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Lesson screen" description="The Guided German skeleton: blue page, progress bar, Maya prompt, interaction zone, dual footer. Explains all 12 lesson screen types." -->
<helmet>
<script src="./ds-base.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7}</style>
</helmet>
<div style="width:390px;height:780px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,#dbeafe,#e0f2fe);overflow:hidden;position:relative;font-family:'Poppins',sans-serif">

  <div style="width:100%;padding:10px 16px 10px 8px;background:#F4F8FF;border-bottom:1px solid #e2e8f0;flex:none;position:relative">
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" aria-label="Leave lesson" style="width:28px;height:28px;display:grid;place-items:center;border-radius:6px;border:2px solid rgba(0,0,0,.4);background:none;cursor:pointer;outline:none;flex:none" style-focus="box-shadow:0 0 0 2px #fff,0 0 0 4px #002856">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
      <span style="font-size:13px;font-weight:600;color:#172554;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ lessonTitle }}</span>
    </div>
    <div style="position:absolute;width:85%;height:4px;right:14px;bottom:4px;background:rgba(0,0,0,.1);border-radius:9999px;overflow:hidden">
      <div style="height:100%;background:#fb923c;transition:width .5s ease-out;width:{{ progressPct }}"></div>
    </div>
  </div>

  <sc-if value="{{ showMaya }}" hint-placeholder-val="{{ true }}">
    <div style="padding:14px 16px 4px;display:flex;align-items:flex-start;gap:10px;flex:none">
      <div style="width:52px;height:52px;border-radius:9999px;background:rgba(255,255,255,.7);flex:none;display:grid;place-items:center;font-size:22px">🎓</div>
      <div style="flex:1;min-width:0;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)">
        <p style="margin:0;font-size:13px;line-height:19px;color:#172554">{{ mayaLine }}</p>
      </div>
    </div>
  </sc-if>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
    <h1 style="margin:0;color:#172554;font-size:20px;font-weight:700;line-height:26px">{{ prompt }}</h1>
    <sc-for list="{{ options }}" as="opt" hint-placeholder-count="3">
      <x-import component-from-global-scope="SkillcaseDesignSystem_a27963.OptionRow" letter="{{ opt.letter }}" label="{{ opt.label }}" state="{{ opt.state }}" hint-size="100%,52px"></x-import>
    </sc-for>
  </div>

  <div style="padding:0 16px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;flex:none">
    <sc-if value="{{ showSkip }}" hint-placeholder-val="{{ true }}">
      <button type="button" style="background:none;border:none;padding:4px 0;font-size:15px;font-weight:500;color:#94a3b8;font-family:inherit;cursor:pointer;outline:none;border-radius:6px" style-focus="box-shadow:0 0 0 2px #fff,0 0 0 4px #002856">{{ skipLabel }}</button>
    </sc-if>
    <div style="width:100%;display:flex;align-items:center;gap:12px">
      <sc-if value="{{ showPrev }}" hint-placeholder-val="{{ true }}">
        <button type="button" style="width:40%;min-height:44px;padding:14px 0;border-radius:12px;border:1px solid #d4d4d8;background:#fff;color:#172554;font-size:15px;font-weight:600;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;outline:none" style-focus="box-shadow:0 0 0 2px #fff,0 0 0 4px #002856">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>Previous
        </button>
      </sc-if>
      <button type="button" style="flex:1;min-height:44px;padding:14px 0;border-radius:12px;border:1px solid #eec139;background:linear-gradient(90deg,#fde68a,#fcd34d);color:#172554;font-size:15px;font-weight:600;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;outline:none" style-focus="box-shadow:0 0 0 2px #fff,0 0 0 4px #002856">
        {{ nextLabel }}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>

  <x-import component-from-global-scope="SkillcaseDesignSystem_a27963.LiveRegion" message="{{ announcement }}" hint-size="0px,0px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:780},&quot;lessonTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Bakery Window&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;prompt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Which word means \&quot;the bakery\&quot;?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;optionLabels&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;der Bäcker\ndie Bäckerei\ndas Brot&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Interaction&quot;},&quot;correctIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Interaction&quot;},&quot;answered&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;selected&quot;,&quot;correct&quot;,&quot;incorrect&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;'none' | 'selected' | 'correct' | 'incorrect'&quot;,&quot;section&quot;:&quot;Interaction&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Chrome&quot;},&quot;showMaya&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chrome&quot;},&quot;mayaLine&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Quick! Before you forget…answer these!&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},&quot;showPrev&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Actions&quot;},&quot;showSkip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Actions&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const answered = this.props.answered ?? 'none';
    const letters = ['A', 'B', 'C', 'D'];
    const labels = (this.props.optionLabels ?? 'der Bäcker\ndie Bäckerei\ndas Brot').split('\n');
    const correctIndex = this.props.correctIndex ?? 1;
    const state = (i) => {
      if (answered === 'none') return 'default';
      if (answered === 'selected') return i === correctIndex ? 'selected' : 'default';
      if (i === correctIndex) return 'correct';
      return answered === 'incorrect' && i === 0 ? 'incorrect' : 'default';
    };
    const p = Math.max(0, Math.min(1, this.props.progress ?? 0.35));
    return {
      lessonTitle: this.props.lessonTitle ?? 'The Bakery Window',
      progressPct: Math.round(p * 100) + '%',
      showMaya: this.props.showMaya ?? true,
      mayaLine: this.props.mayaLine ?? 'Quick! Before you forget…answer these!',
      prompt: this.props.prompt ?? 'Which word means "the bakery"?',
      options: labels.map((label, i) => ({ letter: letters[i] || '', label, state: state(i) })),
      showPrev: this.props.showPrev ?? true,
      showSkip: this.props.showSkip ?? false,
      skipLabel: this.props.skipLabel ?? "I don't know",
      nextLabel: answered === 'none' ? (this.props.nextLabel ?? 'Check') : 'Continue',
      announcement: answered === 'correct' ? 'Correct' : answered === 'incorrect' ? 'Not quite — the correct answer is shown' : '',
    };
  }
}
</script>
</body>
</html>
