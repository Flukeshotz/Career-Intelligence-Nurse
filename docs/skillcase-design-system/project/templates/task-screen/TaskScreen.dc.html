<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Task screen" description="The timed-task and results skeleton: back bar, meter row, scrolling well, footer action. Explains 14+ audited surfaces." -->
<helmet>
<script src="./ds-base.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7}</style>
</helmet>
<div style="width:390px;height:780px;margin:0 auto;display:flex;flex-direction:column;background:#fff;overflow:hidden;position:relative;font-family:'Poppins',sans-serif">

  <div style="align-self:stretch;padding:10px 16px;background:#fff;flex:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button type="button" style="display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:2px;cursor:pointer;font:inherit;outline:none" style-focus="box-shadow:0 0 0 2px #fff,0 0 0 4px #002856;border-radius:6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        <span style="color:#0f172a;font-size:14px;font-weight:600;line-height:24px">Back</span>
      </button>
      <span style="color:#535862;font-size:14px;font-weight:600;line-height:24px">{{ section }}</span>
    </div>
  </div>

  <sc-if value="{{ showMeter }}" hint-placeholder-val="{{ true }}">
    <div style="align-self:stretch;padding:4px 16px 0;display:flex;flex-direction:column;gap:16px;flex:none">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:#082f49;font-size:16px;font-weight:600;line-height:20px;white-space:nowrap">Question {{ counter }} of {{ totalLabel }}</span>
        <div style="padding:4px 8px;background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.05);border-radius:40px;display:inline-flex;align-items:center;gap:6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#082f49" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span style="color:#082f49;font-size:12px;font-weight:500;line-height:20px;font-variant-numeric:tabular-nums">{{ clock }}</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding-bottom:16px">
        <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="5">
          <sc-if value="{{ b.done }}" hint-placeholder-val="{{ true }}">
            <div style="flex:1;height:10px;border-radius:200px;background:#fcd34d"></div>
          </sc-if>
          <sc-if value="{{ b.todo }}" hint-placeholder-val="{{ false }}">
            <div style="flex:1;height:10px;border-radius:200px;background:#e4e4e7"></div>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 16px 140px;display:flex;flex-direction:column;gap:16px">
    <h1 style="margin:0;color:#082f49;font-size:16px;font-weight:600;line-height:20px">Leseverstehen — Teil 2</h1>
    <div style="background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);font-size:12px;line-height:32px;color:#0f172a;text-align:left">Im Stadtzentrum von Bremen eröffnet nächsten Monat eine neue Bibliothek. Die Öffnungszeiten sind von Montag bis Freitag zwischen 9 und 19 Uhr.</div>
    <p style="margin:0;color:#082f49;font-size:14px;font-weight:600">Wann ist die Bibliothek am Samstag geöffnet?</p>
    <x-import component-from-global-scope="SkillcaseDesignSystem_a27963.OptionRow" letter="A" label="Von 9 bis 19 Uhr" hint-size="100%,52px"></x-import>
    <x-import component-from-global-scope="SkillcaseDesignSystem_a27963.OptionRow" letter="B" label="Nur am Vormittag" state="selected" hint-size="100%,52px"></x-import>
    <x-import component-from-global-scope="SkillcaseDesignSystem_a27963.OptionRow" letter="C" label="Gar nicht" hint-size="100%,52px"></x-import>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;flex-direction:column;gap:10px;z-index:40;background:linear-gradient(to top,#fff 55%,rgba(255,255,255,.95) 80%,transparent)">
    <x-import component-from-global-scope="SkillcaseDesignSystem_a27963.LiveRegion" message="{{ announcement }}" hint-size="0px,0px"></x-import>
    <button type="button" style="width:100%;min-height:44px;padding:12px 0;border-radius:8px;border:0;background:#172554;color:#fff;font-size:14px;font-weight:600;font-family:inherit;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);cursor:pointer;outline:none" style-hover="background:#1e3a8a" style-focus="box-shadow:0 0 0 2px #fff,0 0 0 4px #002856">{{ primaryLabel }}</button>
    <sc-if value="{{ secondaryLabel }}" hint-placeholder-val="{{ true }}">
      <button type="button" style="width:100%;min-height:44px;padding:12px 0;border-radius:8px;background:#fff;border:1px solid #d4d4d8;color:#172554;font-size:14px;font-weight:600;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;outline:none" style-focus="box-shadow:0 0 0 2px #fff,0 0 0 4px #002856">{{ secondaryLabel }}</button>
    </sc-if>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:780},&quot;section&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Reading&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showMeter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Structure&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Structure&quot;},&quot;currentIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:11,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Structure&quot;},&quot;secondsLeft&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1284,&quot;min&quot;:0,&quot;max&quot;:3600,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Structure&quot;},&quot;busy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;primaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Next Question&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Actions&quot;},&quot;secondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Previous&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Actions&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const total = this.props.total ?? 5;
    const index = this.props.currentIndex ?? 1;
    const secs = this.props.secondsLeft ?? 1284;
    const pad = (n) => String(n).padStart(2, '0');
    return {
      section: this.props.section ?? 'Reading',
      showMeter: this.props.showMeter ?? true,
      counter: pad(index + 1),
      totalLabel: pad(total),
      clock: Math.floor(secs / 60) + ':' + pad(secs % 60),
      blocks: Array.from({ length: total }).map((_, i) => ({
        done: i <= index,
        todo: i > index,
      })),
      primaryLabel: this.props.busy ? 'Submitting…' : (this.props.primaryLabel ?? 'Next Question'),
      secondaryLabel: this.props.secondaryLabel ?? 'Previous',
      announcement: this.props.busy ? 'Submitting your answers' : '',
    };
  }
}
</script>
</body>
</html>
